[project]
name = "policylens"
version = "0.2.0"
description = "Offline contextual-bandit value estimators and support diagnostics"
requires-python = ">=3.10"
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
policylens = ["artifacts/*.json"]

[tool.setuptools.packages.find]
include = ["policylens*"]
